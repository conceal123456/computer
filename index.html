<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 12 · 回纹/云纹分隔与角框</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--text:#ece5d3;--dim:#9aa3b5}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","SimSun",serif;padding:70px 8vw}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px}
.badge a{color:#57b98a;text-decoration:none}
h2{letter-spacing:.2em;margin:44px 0 20px}
.hr{position:relative;height:26px;display:flex;align-items:center}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.hr span{padding:0 18px;color:var(--gold);letter-spacing:.4em;font-size:14px}
.corner{position:relative;margin:26px auto 0;max-width:640px;padding:34px;border:1px solid rgba(216,180,90,.3);text-align:center}
.corner i{position:absolute;width:26px;height:26px;border:2px solid var(--gold)}
.corner i:nth-child(1){top:-2px;left:-2px;border-right:none;border-bottom:none}
.corner i:nth-child(2){top:-2px;right:-2px;border-left:none;border-bottom:none}
.corner i:nth-child(3){bottom:-2px;left:-2px;border-right:none;border-top:none}
.corner i:nth-child(4){bottom:-2px;right:-2px;border-left:none;border-top:none}
.meander{height:22px;margin-top:44px;
 background:repeating-linear-gradient(90deg,var(--gold) 0 2px,transparent 2px 10px,var(--gold) 10px 12px,transparent 12px 22px),
 repeating-linear-gradient(0deg,rgba(216,180,90,.7) 0 2px,transparent 2px 10px);
 -webkit-mask:linear-gradient(90deg,#000 0 100%);mask-composite:exclude;
 border-top:1px solid rgba(216,180,90,.45);border-bottom:1px solid rgba(216,180,90,.45);opacity:.75}
.cloud{margin-top:40px;text-align:center;color:var(--gold);opacity:.8}
</style></head><body>
<div class="badge">复刻 12 · 出处：<a href="https://reverie365.github.io/poetry-visualization/" target="_blank">砚池云览边饰 + 通行回纹纹样</a></div>
<div class="hr"><span>金 线 分 隔</span></div>
<div class="corner"><i></i><i></i><i></i><i></i>
 <div style="font-size:19px;letter-spacing:.3em">四角回框 · 内容卡</div>
 <div style="font-size:12.5px;color:var(--dim);margin-top:8px">要点：4 个绝对定位角标，答辩 PPT 同款边框语言</div>
</div>
<div class="meander"></div>
<svg class="cloud" width="360" height="36" viewBox="0 0 360 36" fill="none" stroke="#d8b45a" stroke-width="1.5">
 <path d="M10,26 Q22,10 40,20 Q52,6 74,18 Q90,8 108,22 M252,26 Q266,8 286,20 Q300,10 318,22 Q334,12 350,26"/>
 <circle cx="180" cy="18" r="3" fill="#d8b45a"/><circle cx="200" cy="18" r="3" fill="#d8b45a"/></svg>
<h2 style="text-align:center;font-size:15px;color:var(--dim)">祥云分隔 · SVG path 自绘（免版权）</h2>
</body></html>
