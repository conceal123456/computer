<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 18 · 3D 线框地球与经纬网</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--text:#ece5d3}
*{margin:0;padding:0}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(900px 500px at 50% 0%,rgba(87,185,138,.1),transparent 60%),var(--bg);font-family:"Noto Serif SC","SimSun",serif}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#box{position:fixed;inset:0}
.t{position:fixed;top:44px;width:100%;text-align:center;font-size:26px;letter-spacing:.4em;color:var(--text);z-index:2;pointer-events:none}
.s{position:fixed;top:92px;width:100%;text-align:center;font-size:12.5px;color:#9aa3b5;letter-spacing:.25em;z-index:2;pointer-events:none}
</style></head><body>
<div class="badge">复刻 18 · 出处：<a href="https://github.com/3502687683-web/zhuyun-heritage" target="_blank">筑韵千年 three.min.js 用法</a> · 免贴图方案</div>
<div class="t">浑 天 · 地 仪</div><div class="s">要点：wireframe 球体做经纬网，替代需要版权贴图的地球</div>
<div id="box"></div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(W,H);document.getElementById('box').appendChild(r.domElement);
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,W/H,.1,100);cam.position.set(0,2.4,10);
const controls=new THREE.OrbitControls(cam,r.domElement);controls.autoRotate=true;controls.autoRotateSpeed=.7;controls.enableDamping=true;
const globe=new THREE.Group();s.add(globe);
// 经纬网：多圈纬线 + 经线
const green=0x57b98a;
for(let lat=-60;lat<=60;lat+=30){
 const rr=4*Math.cos(lat*Math.PI/180),y=4*Math.sin(lat*Math.PI/180),pts=[];
 for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*rr,y,Math.sin(a)*rr));}
 globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
  new THREE.LineBasicMaterial({color:green,transparent:true,opacity:lat===0?.85:.4})));}
for(let lon=0;lon<180;lon+=22.5){
 const pts=[];for(let i=0;i<=96;i++){const a=i/96*Math.PI*2;
  pts.push(new THREE.Vector3(4*Math.sin(a)*Math.cos(lon*Math.PI/180),4*Math.cos(a),4*Math.sin(a)*Math.sin(lon*Math.PI/180)));}
 globe.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
  new THREE.LineBasicMaterial({color:green,transparent:true,opacity:.35})));}
// 表面标记点（示例：三大观星台）
const MARK=[[113.1,34.4,'登封观星台'],[116.4,39.9,'北京古观象台'],[87.2,43.8,'新疆天文台(示意)']];
MARK.forEach(([lon,lat,n])=>{
 const a=lon*Math.PI/180,b=lat*Math.PI/180;
 const v=new THREE.Vector3(4*Math.cos(b)*Math.sin(a),4*Math.sin(b),4*Math.cos(b)*Math.cos(a));
 const p=new THREE.Mesh(new THREE.SphereGeometry(.09,10,10),new THREE.MeshBasicMaterial({color:0xd8b45a}));
 p.position.copy(v);globe.add(p);
 const c=document.createElement('canvas');c.width=200;c.height=64;const x=c.getContext('2d');
 x.font='700 30px "Noto Serif SC","SimSun",serif';x.textAlign='center';x.fillStyle='#d8b45a';x.fillText(n,100,40);
 const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
 sp.scale.set(2,.64,1);sp.position.copy(v.clone().multiplyScalar(1.22));globe.add(sp);});
const arr=new Float32Array(300*3);for(let i=0;i<300;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(30);arr[i*3]=v.x;arr[i*3+1]=v.y;arr[i*3+2]=v.z;}
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(arr,3));
s.add(new THREE.Points(bg,new THREE.PointsMaterial({color:0xb4c3dc,size:.05})));
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
(function f(){globe.rotation.y+=.0025;controls.update();r.render(s,cam);requestAnimationFrame(f)})();
</script></body></html>
