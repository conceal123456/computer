<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 06 · ECharts 水球图（liquidfill）</title>
<style>
:root{--bg:#070b14;--panel:rgba(17,25,44,.66);--line:rgba(216,180,90,.28);--text:#ece5d3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","SimSun",serif;padding:60px 5vw}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid var(--line);padding:6px 12px;border-radius:3px}
.badge a{color:#57b98a;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:20px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:14px}
#chart{width:100%;height:300px}
.cap{text-align:center;font-size:13.5px;color:#9aa3b5}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="badge">复刻 06 · 出处：<a href="https://github.com/3502687683-web/zhuyun-heritage" target="_blank">筑韵千年（内置 echarts-liquidfill）</a> · 数值为示意</div>
<h2 style="letter-spacing:.15em">水球图三联 <span style="color:var(--gold);font-size:13px">要点：liquidfill 插件 + 双层水波 + 金色描边，适合"完成度/占比"单指标</span></h2>
<div class="grid" id="g"></div>
<script src="echarts.min.js"></script>
<script src="echarts-liquidfill.min.js"></script>
<script>
const D=[['样本数字化率',.62],['构件标注率',.38],['观众互动率',.81]];
const g=document.getElementById('g');
D.forEach(([n,v])=>{const el=document.createElement('div');el.className='card';
 el.innerHTML='<div id="chart"></div><div class="cap">'+n+'（示意）</div>';g.appendChild(el);
 echarts.init(el.querySelector('#chart')).setOption({backgroundColor:'transparent',
  series:[{type:'liquidFill',data:[v,v*.9],radius:'82%',
   color:[{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'#d8b45a'},{offset:1,color:'rgba(200,80,60,.85)'}]}],
   outline:{borderDistance:6,itemStyle:{borderWidth:2,borderColor:'#d8b45a'}},
   backgroundStyle:{color:'rgba(255,255,255,.04)'},label:{color:'#ece5d3',fontSize:30,fontFamily:'Georgia,serif',
    formatter:(v*100).toFixed(0)+'%'}}]});});
</script></body></html>
