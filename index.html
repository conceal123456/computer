<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 28 · 后台布局（顶栏+侧栏+面包屑）</title>
<style>
:root{--bg:#0f1420;--side:#161c2b;--panel:#1b2333;--gold:#d8b45a;--text:#e6ecf7;--dim:#8a97ad;--pri:#4a7fb5}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:var(--bg);color:var(--text);font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:14px}
.badge{position:fixed;top:10px;right:14px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
.top{height:56px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--side);border-bottom:1px solid rgba(255,255,255,.06)}
.logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--gold),#c8503c);display:grid;place-items:center;font-size:13px;color:#1a1a1a;font-weight:900}
.top b{letter-spacing:.1em}
.top .menu{display:flex;gap:4px;margin-left:16px}
.top .menu span{padding:7px 14px;border-radius:6px;color:var(--dim);cursor:pointer;font-size:13.5px}
.top .menu span.on{background:rgba(74,127,181,.22);color:#bcd4ef}
.top .sp{flex:1}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#c8503c,#d8b45a)}
.body{display:flex;height:calc(100vh - 56px)}
.side{width:200px;background:var(--side);padding:14px 10px;border-right:1px solid rgba(255,255,255,.06)}
.side .grp{font-size:11.5px;color:var(--dim);letter-spacing:.2em;margin:14px 10px 8px}
.side .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:7px;color:var(--dim);cursor:pointer}
.side .it.on{background:rgba(216,180,90,.14);color:var(--gold)}
.side .it:hover{background:rgba(255,255,255,.05)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.crumb{display:flex;align-items:center;gap:8px;padding:14px 22px;color:var(--dim);font-size:13px;border-bottom:1px solid rgba(255,255,255,.06)}
.crumb b{color:var(--text)}
.content{flex:1;overflow:auto;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-content:start}
.stat{background:var(--panel);border-radius:10px;padding:18px;border:1px solid rgba(255,255,255,.05)}
.stat .n{font-size:26px;font-weight:700;font-family:Georgia,serif;color:var(--gold);margin-top:6px}
.stat .l{font-size:12.5px;color:var(--dim)}
</style></head><body>
<div class="badge">复刻 28 · 出处：<a href="https://github.com/Clewrart/Web_4C2025" target="_blank">Web_4C2025（国二·Element 风格）+ 砚池云览</a></div>
<div class="top">
 <div class="logo">观</div><b>观乎天文 · 管理端</b>
 <div class="menu"><span class="on">数据看板</span><span>星宿库</span><span>任务审核</span><span>系统设置</span></div>
 <div class="sp"></div><div class="avatar"></div>
</div>
<div class="body">
 <div class="side">
  <div class="grp">— 观测 —</div>
  <div class="it on">◐ 数据看板</div><div class="it">✦ 廿八宿管理</div><div class="it">✧ 航天事件</div>
  <div class="grp">— 系统 —</div>
  <div class="it">⚙ AI 司天监配置</div><div class="it">▣ 用户与团队</div>
 </div>
 <div class="main">
  <div class="crumb">首页 / <b>数据看板</b>　<button style="margin-left:auto;background:rgba(216,180,90,.14);border:1px solid rgba(216,180,90,.35);color:var(--gold);border-radius:6px;padding:6px 14px;font-size:12.5px">＋ 新建星图</button></div>
  <div class="content" id="ct"></div>
 </div>
</div>
<script>
['星宿条目','昨日观星人次','AI 问答数','航天事件','标注任务','团队贡献'].forEach((n,i)=>{
 const el=document.createElement('div');el.className='stat';
 el.innerHTML=`<div class="l">${n}</div><div class="n">${(Math.sin(i*7)*9000|0).toString().replace('-','')}</div>`;
 document.getElementById('ct').appendChild(el);});
</script></body></html>
