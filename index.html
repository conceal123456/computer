<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 29 · 数据看板网格（四图拼合）</title>
<style>
:root{--bg:#070b14;--panel:rgba(17,25,44,.66);--line:rgba(216,180,90,.28);--gold:#d8b45a;--text:#ece5d3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","SimSun",serif;padding:50px 4vw}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid var(--line);padding:6px 12px;border-radius:3px}
.badge a{color:#57b98a;text-decoration:none}
h2{text-align:center;letter-spacing:.25em;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:150px;gap:14px}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px}
.card h4{font-size:13px;color:#9aa3b5;letter-spacing:.2em;margin-bottom:4px}
.chart{width:100%;height:calc(100% - 26px)}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:900px){.c6,.c4,.c8,.c12{grid-column:span 12}.grid{grid-auto-rows:200px}}
</style></head><body>
<div class="badge">复刻 29 · 出处：<a href="https://github.com/3502687683-web/zhuyun-heritage" target="_blank">筑韵千年网格密度 + 观乎天文配色</a> · 数据为示意</div>
<h2>数 说 巡 天 · 看 板</h2>
<div class="grid">
 <div class="card c8"><h4>发射次数趋势（公开统计口径）</h4><div class="chart" id="c1"></div></div>
 <div class="card c4"><h4>命名谱系占比（示意）</h4><div class="chart" id="c2"></div></div>
 <div class="card c4"><h4>四象任务分布（示意）</h4><div class="chart" id="c3"></div></div>
 <div class="card c8"><h4>观星台访问热度（示意）</h4><div class="chart" id="c4"></div></div>
</div>
<script src="echarts.min.js"></script>
<script>
const TT={backgroundColor:'transparent',tooltip:{backgroundColor:'rgba(11,17,32,.94)',borderColor:'rgba(216,180,90,.4)',textStyle:{color:'#ece5d3'}}};
const AX={axisLine:{lineStyle:{color:'rgba(154,163,181,.45)'}},axisLabel:{color:'#9aa3b5',fontSize:10}};
const mk=(id,opt)=>echarts.init(document.getElementById(id)).setOption({...TT,...opt});
mk('c1',{grid:{left:38,right:14,top:20,bottom:26},xAxis:{type:'category',data:['2016','2017','2018','2019','2020','2021','2022','2023','2024'],...AX},
 yAxis:{type:'value',axisLabel:{color:'#9aa3b5',fontSize:10},splitLine:{lineStyle:{color:'rgba(154,163,181,.14)'}}},
 series:[{type:'bar',data:[22,18,39,34,39,55,64,67,68],barWidth:'55%',itemStyle:{borderRadius:[3,3,0,0],
  color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'#d8b45a'},{offset:1,color:'rgba(200,80,60,.5)'}])}}]});
mk('c2',{series:[{type:'pie',radius:['42%','72%'],data:[
 {name:'星官体系',value:2,itemStyle:{color:'#d8b45a'}},{name:'神话人物',value:6,itemStyle:{color:'#c8503c'}},
 {name:'典籍意象',value:4,itemStyle:{color:'#5b8fc9'}}],
 label:{color:'#9aa3b5',fontSize:10},itemStyle:{borderColor:'#070b14',borderWidth:2}}]});
mk('c3',{radar:{indicator:[{name:'青龙',max:10},{name:'玄武',max:10},{name:'白虎',max:10},{name:'朱雀',max:10}],
  radius:'62%',axisName:{color:'#9aa3b5',fontSize:10},splitLine:{lineStyle:{color:'rgba(154,163,181,.2)'}},
  splitArea:{show:false},axisLine:{lineStyle:{color:'rgba(154,163,181,.2)'}}},
 series:[{type:'radar',data:[{value:[7,7,7,7],name:'七宿各七'}],
  areaStyle:{color:'rgba(216,180,90,.25)'},lineStyle:{color:'#d8b45a'},itemStyle:{color:'#d8b45a'}}]});
mk('c4',{grid:{left:38,right:14,top:20,bottom:26},xAxis:{type:'category',data:['一','二','三','四','五','六','日'],...AX},
 yAxis:{type:'value',axisLabel:{color:'#9aa3b5',fontSize:10},splitLine:{lineStyle:{color:'rgba(154,163,181,.14)'}}},
 series:[{type:'line',smooth:true,data:[120,200,180,340,520,880,640],symbol:'none',
  lineStyle:{color:'#57b98a',width:2.5},areaStyle:{color:'rgba(87,185,138,.18)'}}]});
addEventListener('resize',()=>location.reload());
</script></body></html>
