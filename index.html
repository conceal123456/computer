<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 37 · WebGL 星云着色器</title>
<style>
:root{--gold:#d8b45a;--text:#ece5d3}
*{margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#04060d;font-family:"Noto Serif SC","SimSun",serif}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#cv{position:fixed;inset:0;width:100%;height:100%}
.t{position:fixed;bottom:9vh;width:100%;text-align:center;font-size:clamp(24px,4vw,44px);font-weight:900;letter-spacing:.4em;color:var(--text);z-index:2;pointer-events:none;text-shadow:0 0 26px rgba(216,180,90,.5)}
.s{position:fixed;bottom:5vh;width:100%;text-align:center;font-size:12px;color:#8a97ad;letter-spacing:.35em;z-index:2;pointer-events:none}
</style></head><body>
<div class="badge">进阶 37 · 类型：WebGL 片元着色器（原生 GL，零库）</div>
<canvas id="cv"></canvas>
<div class="t">星 云 · 吞 吐 千 年</div>
<div class="s">RAW WEBGL · FBM NOISE · 移动鼠标扰动星云</div>
<script>
/* 要点：不借助 three.js，原生 WebGL 画一个全屏三角形，
   片元着色器里用 value noise + fbm 分形叠加出流动星云。
   这是"着色器艺术"类作品的最小骨架，性能远超粒子方案。 */
var cv=document.getElementById('cv');
var gl=cv.getContext('webgl',{antialias:false});
if(!gl){document.body.innerHTML='<p style="color:#ece5d3;text-align:center;margin-top:40vh">当前设备不支持 WebGL</p>';}
else{
var VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
var FS=['precision highp float;',
'uniform vec2 R;uniform float T;uniform vec2 M;',
'float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}',
'float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);',
' return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}',
'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(1.7,4.3);a*=.5;}return v;}',
'void main(){',
' vec2 uv=(gl_FragCoord.xy*2.-R)/R.y;',
' vec2 m=(M*2.-R)/R.y;',
' float t=T*.06;',
' vec2 q=uv*1.6;',
' float n1=fbm(q+vec2(t,-t*.6)+m*.12);',
' float n2=fbm(q*2.1+vec2(-t*.8,t*.4)+n1*1.5);',
' float cloud=smoothstep(.35,.95,n1*.65+n2*.5);',
' vec3 deep=vec3(.016,.03,.07);',
' vec3 blue=vec3(.10,.22,.42);',
' vec3 gold=vec3(.85,.71,.35);',
' vec3 red =vec3(.72,.28,.20);',
' vec3 col=deep+blue*cloud*.9;',
' col+=gold*pow(cloud,3.2)*.95;',
' col+=red*pow(n2,4.0)*.55;',
' float star=step(.9975,hash(floor(gl_FragCoord.xy*.7)+floor(T)*.01));',
' col+=vec3(star)*(.4+.6*hash(gl_FragCoord.xy+T));',
' float vig=1.-dot(uv*.62,uv*.62);',
' gl_FragColor=vec4(col*vig,1.);',
'}'].join('\n');
function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s;}
var prog=gl.createProgram();
gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw gl.getProgramInfoLog(prog);
gl.useProgram(prog);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 3,-1, -1,3]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var uR=gl.getUniformLocation(prog,'R'),uT=gl.getUniformLocation(prog,'T'),uM=gl.getUniformLocation(prog,'M');
var MX=.5,MY=.5,TX=.5,TY=.5;
function size(){cv.width=innerWidth;cv.height=innerHeight;gl.viewport(0,0,cv.width,cv.height);}
size();addEventListener('resize',size);
addEventListener('mousemove',function(e){TX=e.clientX/innerWidth;TY=1-e.clientY/innerHeight;});
(function f(now){
  MX+=(TX-MX)*.03;MY+=(TY-MY)*.03;
  gl.uniform2f(uR,cv.width,cv.height);gl.uniform1f(uT,now*.001);gl.uniform2f(uM,MX*cv.width,MY*cv.height);
  gl.drawArrays(gl.TRIANGLES,0,3);
  requestAnimationFrame(f);
})(0);
}
</script></body></html>
