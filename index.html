<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 04 · ECharts 旭日图「营造系谱」</title>
<style>
:root{--bg:#070b14;--panel:rgba(17,25,44,.66);--line:rgba(216,180,90,.28);--text:#ece5d3}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif SC","SimSun",serif;padding:60px 5vw}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid var(--line);padding:6px 12px;border-radius:3px}
.badge a{color:#57b98a;text-decoration:none}
.card{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:18px;margin-top:20px}
#chart{width:100%;height:520px}
.cap{font-size:13px;color:#9aa3b5;margin-top:8px}
</style></head><body>
<div class="badge">复刻 04 · 出处：<a href="https://github.com/3502687683-web/zhuyun-heritage" target="_blank">筑韵千年·建筑营造系总览旭日图</a> · 结构示意</div>
<h2 style="letter-spacing:.15em">ECharts 旭日图 <span style="color:var(--gold);font-size:13px">要点：三级环 + radial 标签 + 分支配色，适合"谱系/分类"叙事</span></h2>
<div class="card"><div id="chart"></div><div class="cap">示意：中国古建营造体系谱系（内环三大系 → 中环形制 → 外环代表案例）</div></div>
<script src="echarts.min.js"></script>
<script>
echarts.init(document.getElementById('chart')).setOption({backgroundColor:'transparent',
 tooltip:{backgroundColor:'rgba(11,17,32,.94)',borderColor:'rgba(216,180,90,.4)',textStyle:{color:'#ece5d3'}},
 series:[{type:'sunburst',radius:[14,'94%'],data:[
  {name:'木构体系',itemStyle:{color:'#b3924a'},children:[
   {name:'抬梁式',children:[{name:'佛光寺东大殿'},{name:'故宫太和殿'}]},
   {name:'穿斗式',children:[{name:'徽州民居'},{name:'吊脚楼'}]}]},
  {name:'砖石体系',itemStyle:{color:'#c8503c'},children:[
   {name:'砖塔',children:[{name:'嵩岳寺塔'},{name:'大雁塔'}]},
   {name:'石桥',children:[{name:'赵州桥'},{name:'洛阳桥'}]}]},
  {name:'生土体系',itemStyle:{color:'#4a7fb5'},children:[
   {name:'夯土',children:[{name:'福建土楼'},{name:'汉代城墙'}]},
   {name:'窑洞',children:[{name:'陕北靠崖窑'}]}]}],
  label:{color:'#ece5d3',fontFamily:'serif',rotate:'radial',fontSize:12},
  itemStyle:{borderColor:'rgba(7,11,20,.85)',borderWidth:2},
  emphasis:{itemStyle:{shadowBlur:18,shadowColor:'rgba(216,180,90,.5)'}},
  levels:[{},{r0:14,r:52,label:{fontSize:14,fontWeight:700,rotate:'tangential'}},{r0:52,r:74},{r0:74,r:94,label:{fontSize:11}}]}]});
</script></body></html>
