<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 10 · 书法标题 + 印章盖章动效</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--cinnabar:#c8503c;--text:#ece5d3}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;
 background:radial-gradient(1000px 500px at 50% 0%,rgba(91,143,201,.12),transparent 60%),var(--bg);
 font-family:"Noto Serif SC","STZhongsong","SimSun",serif;overflow:hidden}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid var(--line);padding:6px 12px;border-radius:3px}
.badge a{color:#57b98a;text-decoration:none}
h1{font-size:clamp(52px,8vw,100px);font-weight:900;letter-spacing:.2em;color:var(--text);
 text-shadow:0 0 36px rgba(216,180,90,.4);opacity:0;animation:rise 1s .2s forwards}
h1 em{font-style:normal;color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.seal{width:92px;height:92px;background:var(--cinnabar);color:#f5efe0;display:grid;place-items:center;
 font-size:26px;line-height:1.2;border-radius:8px;box-shadow:0 6px 22px rgba(200,80,60,.45);
 opacity:0;transform:scale(2.6) rotate(14deg);animation:stamp .5s 1.15s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{opacity:.96;transform:scale(1) rotate(-4deg)}}
.sub{font-size:14px;letter-spacing:.5em;color:#9aa3b5;opacity:0;animation:rise 1s 1.5s forwards}
button{margin-top:6px;background:none;border:1px solid rgba(216,180,90,.4);color:var(--gold);font-family:inherit;
 font-size:13px;letter-spacing:.3em;padding:9px 22px;border-radius:3px;cursor:pointer}
button:hover{background:rgba(216,180,90,.12)}
</style></head><body>
<div class="badge">复刻 10 · 出处：<a href="https://reverie365.github.io/poetry-visualization/" target="_blank">砚池云览 + 观乎天文</a></div>
<h1>观乎<em>天文</em></h1>
<div class="seal">敬授<br>人时</div>
<div class="sub">观 乎 天 文 · 以 察 时 变</div>
<button onclick="location.reload()">重播盖章动效</button>
</body></html>
