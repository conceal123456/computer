<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 31 · 粒子文字汇聚</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--text:#ece5d3;--dim:#9aa3b5}
*{margin:0;padding:0}
body{height:100vh;overflow:hidden;background:radial-gradient(900px 460px at 50% 0%,rgba(91,143,201,.1),transparent 60%),var(--bg);font-family:"Noto Serif SC","STZhongsong","SimSun",serif;cursor:pointer}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#cv{position:fixed;inset:0}
.tip{position:fixed;bottom:26px;width:100%;text-align:center;font-size:12.5px;color:var(--dim);letter-spacing:.4em;pointer-events:none}
</style></head><body>
<div class="badge">进阶 31 · 类型：文字粒子汇聚 · 参考对象：各类获奖开场动画的通行手法</div>
<canvas id="cv"></canvas>
<div class="tip">点 击 · 换 一 组 字</div>
<script>
/* 要点：离屏 canvas 写字 → getImageData 采样字形像素 → 每个亮像素一个粒子 →
   粒子从随机位置缓动飞向目标点。这是"文字粒子"类动画的完整最小实现。 */
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var W,H,parts=[],WORDS=['观乎天文','敬授人时','斗转星移','荧惑守心'],wi=0;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;build();}
function targets(word){
  var off=document.createElement('canvas');off.width=W;off.height=H;
  var o=off.getContext('2d');
  var fs=Math.min(W/ (word.length*1.15), H*0.42);
  o.font='900 '+fs+'px "Noto Serif SC","STZhongsong","SimSun",serif';
  o.textAlign='center';o.textBaseline='middle';o.fillStyle='#fff';
  o.fillText(word,W/2,H/2);
  var d=o.getImageData(0,0,W,H).data,pts=[],gap=Math.max(4,Math.round(fs/28));
  for(var y=0;y<H;y+=gap)for(var xx=0;xx<W;xx+=gap){
    if(d[(y*W+xx)*4+3]>128)pts.push([xx,y]);
  }
  return pts;
}
function build(){
  var pts=targets(WORDS[wi]);
  // 粒子数对齐：多退少补
  while(parts.length<pts.length)parts.push(newP(true));
  parts.length=pts.length;
  for(var i=0;i<pts.length;i++){parts[i].tx=pts[i][0];parts[i].ty=pts[i][1];}
}
function newP(init){var a=Math.random()*6.28,r=Math.max(W,H)*.6;
  return {x:W/2+Math.cos(a)*r*(init?1:0.2)+ (init?0:(Math.random()-.5)*W*.5),
          y:H/2+Math.sin(a)*r*(init?1:0.2),tx:0,ty:0,
          s:.9+Math.random()*1.7,o:.4+Math.random()*.6};}
function frame(){
  x.fillStyle='rgba(7,11,20,.28)';x.fillRect(0,0,W,H);   // 拖影
  for(var i=0;i<parts.length;i++){var p=parts[i];
    p.x+=(p.tx-p.x)*.055;p.y+=(p.ty-p.y)*.055;           // 缓动汇聚
    x.beginPath();x.arc(p.x,p.y,p.s,0,6.29);
    x.fillStyle='rgba(216,180,90,'+p.o+')';x.fill();}
  requestAnimationFrame(frame);
}
size();addEventListener('resize',size);
addEventListener('click',function(){wi=(wi+1)%WORDS.length;build();});
frame();
</script></body></html>
