<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 40 · 鼠标星尘跟随</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--text:#ece5d3}
*{margin:0;padding:0}
body{height:100vh;overflow:hidden;background:radial-gradient(900px 460px at 50% 40%,rgba(91,143,201,.1),transparent 60%),var(--bg);font-family:"Noto Serif SC","SimSun",serif;cursor:crosshair}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#cv{position:fixed;inset:0}
.t{position:fixed;top:38vh;width:100%;text-align:center;font-size:clamp(30px,5vw,58px);font-weight:900;letter-spacing:.35em;color:var(--text);pointer-events:none;z-index:2}
.s{position:fixed;top:calc(38vh + 84px);width:100%;text-align:center;font-size:13px;letter-spacing:.45em;color:#8a97ad;pointer-events:none;z-index:2}
</style></head><body>
<div class="badge">进阶 40 · 类型：光标星尘跟随</div>
<canvas id="cv"></canvas>
<div class="t">挥 袖 生 星</div>
<div class="s">移 动 鼠 标 · 点 击 爆 开 一 抔 星 尘</div>
<script>
/* 要点：光标特效 = 鼠标移动时按间隔"撒"粒子（带初速度+阻尼+重力衰减），
   点击时爆发一簇。粒子池上限控制性能。主作品每页都能加，成本低、质感高。 */
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}size();addEventListener('resize',size);
var P=[],MAX=520,last=null;
function add(px,py,n,burst){
  for(var i=0;i<n;i++){
    if(P.length>=MAX)P.shift();
    var a=Math.random()*6.28,sp=burst?(1.5+Math.random()*4):(.3+Math.random()*1.3);
    P.push({x:px,y:py,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-(burst?1.2:.25),
      s:.6+Math.random()*1.9,life:1,dl:.008+Math.random()*.016,g:burst?.05:.012,
      hue:Math.random()<.82?'216,180,90':'236,229,211'});}}
addEventListener('mousemove',function(e){
  if(!last){last=[e.clientX,e.clientY];return;}
  var d=Math.hypot(e.clientX-last[0],e.clientY-last[1]);
  var n=Math.min(6,Math.max(1,Math.round(d/9)));
  for(var i=0;i<n;i++){var t=i/n;
    add(last[0]+(e.clientX-last[0])*t,last[1]+(e.clientY-last[1])*t,1,false);}
  last=[e.clientX,e.clientY];});
addEventListener('click',function(e){add(e.clientX,e.clientY,46,true);});
function frame(){
  x.fillStyle='rgba(7,11,20,.20)';x.fillRect(0,0,W,H);   // 拖尾
  for(var i=P.length-1;i>=0;i--){var p=P[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.985;p.vy*=.985;p.life-=p.dl;
    if(p.life<=0){P.splice(i,1);continue;}
    x.beginPath();x.arc(p.x,p.y,p.s*p.life+.2,0,6.29);
    x.fillStyle='rgba('+p.hue+','+(p.life*.9)+')';x.fill();}
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
