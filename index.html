<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 35 · 航线流动图</title>
<style>
:root{--bg:#070b14;--gold:#d8b45a;--text:#ece5d3;--dim:#9aa3b5}
*{margin:0;padding:0}
body{height:100vh;overflow:hidden;background:radial-gradient(1000px 500px at 50% 110%,rgba(74,127,181,.14),transparent 65%),var(--bg);font-family:"Noto Serif SC","SimSun",serif;cursor:pointer}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#cv{position:fixed;inset:0}
.t{position:fixed;top:34px;width:100%;text-align:center;font-size:24px;letter-spacing:.35em;color:var(--text);pointer-events:none;z-index:2}
.r{position:fixed;top:80px;width:100%;text-align:center;font-size:13px;color:var(--dim);letter-spacing:.3em;pointer-events:none;z-index:2}
.tip{position:fixed;bottom:24px;width:100%;text-align:center;font-size:12px;color:var(--dim);letter-spacing:.35em;z-index:2;pointer-events:none}
</style></head><body>
<div class="badge">进阶 35 · 类型：航线流动图 · 港口位置为示意布局</div>
<div class="t">海 上 丝 缭 · 千 帆 流 光</div>
<div class="r" id="rt">航线一：郑和下西洋（1405–1433）</div>
<canvas id="cv"></canvas>
<div class="tip">点 击 · 切 换 航 线</div>
<script>
/* 要点：贝塞尔航线 + 沿曲线运动的"彗星"光点（参数 t 插值），多船错峰；
   这是航线/迁徙/物流类可视化的核心手法。 */
var cv=document.getElementById('cv'),x=cv.getContext('2d');
var W,H;function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;}size();addEventListener('resize',size);
var ROUTES=[
 {name:'航线一：郑和下西洋（1405–1433）',pts:[['南京',.06,.62],['泉州',.18,.78],['占城',.30,.72],['满剌加',.44,.66],['锡兰',.55,.70],['古里',.64,.60],['忽鲁谟斯',.78,.42],['木骨都束',.84,.62]]},
 {name:'航线二： silkroad 海上丝路（唐宋市舶）',pts:[['广州',.10,.80],['交州',.22,.74],['三佛齐',.36,.70],['细兰',.52,.68],['波斯湾',.72,.50],['红海',.88,.36]]},
 {name:'航线三：鉴真东渡（753）',pts:[['扬州',.30,.50],['明州',.40,.56],['种子岛',.62,.48],['难波',.80,.36]]}];
var ri=0;
function P(i){var r=ROUTES[ri].pts;return [r[i][1]*W,r[i][2]*H*.9+H*.03];}
function bezier(a,b,c,t){var u=1-t;return [u*u*a[0]+2*u*t*b[0]+t*t*c[0], u*u*a[1]+2*u*t*b[1]+t*t*c[1]];}
function draw(now){
  x.fillStyle='rgba(7,11,20,.30)';x.fillRect(0,0,W,H);   // 拖影
  var r=ROUTES[ri],pts=[];
  for(var i=0;i<r.pts.length;i++)pts.push(P(i));
  // 航线（分段贝塞尔，向上拱起）
  x.strokeStyle='rgba(216,180,90,.34)';x.lineWidth=1.6;x.setLineDash([6,7]);
  x.beginPath();x.moveTo(pts[0][0],pts[0][1]);
  for(i=1;i<pts.length;i++){
    var a=pts[i-1],b=pts[i],mx=(a[0]+b[0])/2,my=Math.min(a[1],b[1])-60-Math.abs(b[0]-a[0])*.08;
    x.quadraticCurveTo(mx,my,b[0],b[1]);}
  x.stroke();x.setLineDash([]);
  // 港口
  r.pts.forEach(function(p,i){
    x.beginPath();x.arc(pts[i][0],pts[i][1],5,0,6.29);
    x.fillStyle='#d8b45a';x.fill();
    x.beginPath();x.arc(pts[i][0],pts[i][1],10+Math.sin(now/500+i)*2.5,0,6.29);
    x.strokeStyle='rgba(216,180,90,.4)';x.stroke();
    x.fillStyle='#ece5d3';x.font='14px "Noto Serif SC","SimSun",serif';x.textAlign='center';
    x.fillText(p[0],pts[i][0],pts[i][1]-16);});
  // 彗星船队
  var T=(now/1400)%1;
  for(i=1;i<pts.length;i++){
    var a2=pts[i-1],b2=pts[i],mx2=(a2[0]+b2[0])/2,my2=Math.min(a2[1],b2[1])-60-Math.abs(b2[0]-a2[0])*.08;
    for(var k=0;k<3;k++){
      var tt=(T+k*.13+i*.21)%1;
      var pos=bezier(a2,[mx2,my2],b2,tt);
      var fade=Math.sin(tt*Math.PI);
      x.beginPath();x.arc(pos[0],pos[1],3.2*fade+1,0,6.29);
      x.fillStyle='rgba(236,229,211,'+(.85*fade)+')';x.fill();}}
  requestAnimationFrame(draw);
}
addEventListener('click',function(){ri=(ri+1)%ROUTES.length;document.getElementById('rt').textContent=ROUTES[ri].name;});
requestAnimationFrame(draw);
</script></body></html>
