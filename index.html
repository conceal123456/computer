<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>复刻 16 · 3D 亭台剪影旋转台</title>
<style>
:root{--bg:#0a0e1a;--gold:#d8b45a;--text:#ece5d3}
*{margin:0;padding:0}
body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(800px 400px at 50% 100%,rgba(200,80,60,.12),transparent 60%),var(--bg);font-family:"Noto Serif SC","SimSun",serif}
.badge{position:fixed;top:14px;right:16px;font-size:12px;color:var(--gold);background:rgba(11,17,32,.9);border:1px solid rgba(216,180,90,.28);padding:6px 12px;border-radius:3px;z-index:9}
.badge a{color:#57b98a;text-decoration:none}
#box{position:fixed;inset:0}
.t{position:fixed;top:44px;width:100%;text-align:center;font-size:26px;letter-spacing:.4em;color:var(--text);z-index:2;pointer-events:none}
.s{position:fixed;top:92px;width:100%;text-align:center;font-size:12.5px;color:#9aa3b5;letter-spacing:.25em;z-index:2;pointer-events:none}
</style></head><body>
<div class="badge">复刻 16 · 出处：<a href="https://github.com/3502687683-web/zhuyun-heritage" target="_blank">筑韵千年·3D 专题屏（亭台建模思路）</a> · 原作为精细古建模型，此为 primitives 极简版</div>
<div class="t">危 楼 高 百 尺</div><div class="s">要点：柱/檐/攒尖顶全部由基础几何拼装，翘角用 Torus 弧段示意</div>
<div id="box"></div>
<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script>
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setSize(W,H);document.getElementById('box').appendChild(r.domElement);
const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,W/H,.1,100);cam.position.set(7,4.5,9);cam.lookAt(0,1.6,0);
const controls=new THREE.OrbitControls(cam,r.domElement);controls.autoRotate=true;controls.autoRotateSpeed=.8;controls.enableDamping=true;controls.target.set(0,1.6,0);
const gold=0xd8b45a,ink=0x2c2c34;
const mGold=new THREE.MeshStandardMaterial({color:gold,roughness:.6});
const mInk=new THREE.MeshStandardMaterial({color:ink,roughness:.85});
// 台基
s.add(new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.8,.5,4),mInk)).position.y=.25;
// 柱（八柱）
for(let i=0;i<8;i++){const a=i/8*Math.PI*2;
 const c=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,2.4,10),mGold);
 c.position.set(Math.cos(a)*2.2,1.7,Math.sin(a)*2.2);s.add(c);}
// 双层檐（八棱锥台）
const eave1=new THREE.Mesh(new THREE.ConeGeometry(3.1,1,8),mGold);eave1.position.y=3.1;s.add(eave1);
const eave2=new THREE.Mesh(new THREE.ConeGeometry(2.2,.9,8),mGold);eave2.position.y=4.15;s.add(eave2);
// 宝顶
const top=new THREE.Mesh(new THREE.SphereGeometry(.22,12,12),mGold);top.position.y=4.85;s.add(top);
// 地面星光
const arr=new Float32Array(300*3);for(let i=0;i<300;i++){const v=new THREE.Vector3().randomDirection().multiplyScalar(30);arr[i*3]=v.x;arr[i*3+1]=Math.abs(v.y)*.6+1;arr[i*3+2]=v.z;}
const bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(arr,3));
s.add(new THREE.Points(bg,new THREE.PointsMaterial({color:0xb4c3dc,size:.05})));
s.add(new THREE.AmbientLight(0x8fa3c7,.65));
const d=new THREE.DirectionalLight(0xfff2d8,1.2);d.position.set(4,7,3);s.add(d);
addEventListener('resize',()=>{r.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();});
(function f(){controls.update();r.render(s,cam);requestAnimationFrame(f)})();
</script></body></html>
