<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苍龙转场 · 东方苍龙 · 七宿成形</title>
<style>
/* ===== 设计 token：与主文件 index.html 完全一致 ===== */
:root{
  --bg:#070b14;--bg2:#0b1120;
  --gold:#d8b45a;--gold-dim:#9c8549;
  --cinnabar:#c8503c;--text:#ece5d3;--dim:#9aa3b5;
  --qing:#57b98a;
  --serif:"Noto Serif SC","STZhongsong","SimSun",serif
}
/* 以下 body 规则仅供本片段单独双击预览；日后整体内联进主文件时可删除 */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);overflow:hidden;font-family:var(--serif)}

/* ===== 苍龙转场根节点：全部内容包在 #dragon-root，方便整体内联 ===== */
#dragon-root{position:fixed;inset:0;z-index:9000;font-family:var(--serif);cursor:pointer;user-select:none;-webkit-user-select:none}

/* 场景层：淡出即"露出"底部的进入提示 */
.dragon-scene{position:absolute;inset:0;transition:opacity 1.4s ease .1s,transform 1.7s ease .1s}
.dragon-scene.is-out{opacity:0;transform:scale(1.015)}

/* 深色星空底：底部金绿色 radial 渐变，呼应东方青龙 */
.dragon-sky{position:absolute;inset:0;background:
  radial-gradient(1200px 560px at 50% 108%,rgba(87,185,138,.13),transparent 62%),
  radial-gradient(820px 400px at 84% 112%,rgba(216,180,90,.07),transparent 60%),
  var(--bg)}
#dragon-canvas{position:absolute;inset:0;width:100%;height:100%}

/* 章节大字：letter-spacing .8em→.3em 收束，blur 8px→0 */
.dragon-title{position:absolute;top:14%;left:0;width:100%;text-align:center;line-height:1.25;
  font-size:clamp(30px,5vw,54px);font-weight:900;color:var(--text);
  letter-spacing:.3em;padding-left:.3em;opacity:0;will-change:letter-spacing,filter,opacity}
#dragon-root.play .dragon-title{animation:dragonTitle 1.7s cubic-bezier(.23,.7,.32,1) .15s forwards}
@keyframes dragonTitle{
  0%{letter-spacing:.8em;padding-left:.8em;filter:blur(8px);opacity:0}
  45%{opacity:1}
  100%{letter-spacing:.3em;padding-left:.3em;filter:blur(0);opacity:1}}

/* 题下鎏金细线：随标题成形缓缓展开 */
.dragon-rule{position:absolute;top:calc(14% + 76px);left:50%;transform:translateX(-50%);
  width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(216,180,90,.65),transparent)}
#dragon-root.play .dragon-rule{animation:dragonRule 1.1s ease-out 1.35s forwards}
@keyframes dragonRule{to{width:min(340px,46vw)}}

/* 结尾提示（在根节点内、场景层之外，随场景淡出而浮现） */
.dragon-hint{position:absolute;left:50%;bottom:38px;transform:translate(-50%,10px);
  font-size:13px;letter-spacing:.32em;color:var(--dim);white-space:nowrap;
  border:1px solid rgba(216,180,90,.22);background:rgba(11,17,32,.72);
  padding:9px 26px;border-radius:20px;opacity:0;
  transition:opacity 1s ease .35s,transform 1s ease .35s;pointer-events:none}
.dragon-hint b{color:var(--gold);font-weight:600}
.dragon-hint.is-on{opacity:1;transform:translate(-50%,0)}
.dragon-replay{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);
  font-size:11px;letter-spacing:.3em;color:rgba(154,163,181,.5);opacity:0;
  transition:opacity 1s ease .9s;pointer-events:none;white-space:nowrap}
.dragon-replay.is-on{opacity:1}
</style>
</head>
<body>
<div id="dragon-root" class="play">
  <div class="dragon-scene" id="dragon-scene">
    <div class="dragon-sky"></div>
    <canvas id="dragon-canvas"></canvas>
    <h1 class="dragon-title">东方苍龙 · 七宿成形</h1>
    <div class="dragon-rule"></div>
  </div>
  <div class="dragon-hint" id="dragon-hint">即将进入 · <b>廿八宿星图</b></div>
  <div class="dragon-replay" id="dragon-replay">点击任意处重播</div>
</div>
<script>
(function(){
'use strict';
var root=document.getElementById('dragon-root');
var scene=document.getElementById('dragon-scene');
var hint=document.getElementById('dragon-hint');
var replayTip=document.getElementById('dragon-replay');
var cv=document.getElementById('dragon-canvas');
var cx=cv.getContext('2d');

/* ---------- 时间轴（秒） ---------- */
var STAR0=.70,  STAR_GAP=.35, STAR_DUR=.55;   /* 星点逐颗点亮 */
var SEG0=3.00,  SEG_GAP=.35,  SEG_DUR=.60;    /* 连线逐段生长 */
var DONE_T=SEG0+5*SEG_GAP+SEG_DUR;            /* 5.35s 七段贯通 */
var FADE_T=DONE_T+3.5;                        /* 8.85s 完成后 3.5s，整体淡出 */

/* 七宿相对坐标（沿用 demo20：龙头低昂、龙尾扬起） */
var XI=[[.18,.62,'角'],[.28,.50,'亢'],[.38,.58,'氐'],[.48,.46,'房'],[.58,.52,'心'],[.68,.38,'尾'],[.80,.30,'箕']];

/* 背景星：一次性生成固定坐标，杜绝逐帧随机带来的闪烁 */
var BG=[];
for(var i=0;i<130;i++){
  BG.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*.9,p:Math.random()*6.283,s:.35+Math.random()*.5});
}

var W=0,H=0;
function size(){
  var d=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  cx.setTransform(d,0,0,d,0,0);
}
size();addEventListener('resize',size);

/* 七宿实际落点：水平同 demo20，纵向整体下移让位标题 */
function P(i){var s=XI[i];return[s[0]*W,H*(.45+(s[1]-.45)*.78)];}
function clamp01(v){return v<0?0:v>1?1:v;}
function smooth(t){t=clamp01(t);return t*t*(3-2*t);}
function outCubic(t){t=clamp01(t);return 1-Math.pow(1-t,3);}

var t0=null,fired=false;
function draw(now){
  requestAnimationFrame(draw);
  if(t0===null)t0=now;
  var t=(now-t0)/1000;
  if(fired&&t>FADE_T+2)return;               /* 淡出完成后停绘，点击重播会重置 */
  cx.clearRect(0,0,W,H);

  /* 背景星：缓慢明灭 */
  cx.fillStyle='#b2c0da';
  for(var a=0;a<BG.length;a++){var s=BG[a];
    cx.globalAlpha=.08+.22*(.5+.5*Math.sin(t*(.4+s.s)+s.p));
    cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,6.283);cx.fill();}
  cx.globalAlpha=1;

  /* 整龙呼吸系数（七段贯通后生效，周期约 3.2s，幅度克制） */
  var pulse=t>DONE_T?(.5+.5*Math.sin((t-DONE_T)*6.283/3.2)):0;

  /* 连线逐段生长：青龙绿，先铺外晕再描主体，生长端带一点微光 */
  cx.lineCap='round';
  for(var i=0;i<XI.length-1;i++){
    var seg=(t-(SEG0+i*SEG_GAP))/SEG_DUR;
    if(seg<=0)break;
    var e=smooth(seg),p1=P(i),p2=P(i+1);
    var ex=p1[0]+(p2[0]-p1[0])*e,ey=p1[1]+(p2[1]-p1[1])*e;
    cx.beginPath();cx.moveTo(p1[0],p1[1]);cx.lineTo(ex,ey);
    cx.strokeStyle='rgba(87,185,138,'+(.10+.08*pulse).toFixed(3)+')';cx.lineWidth=7;cx.stroke();
    cx.strokeStyle='rgba(87,185,138,.85)';cx.lineWidth=2.2;cx.stroke();
    if(seg<1){
      cx.beginPath();cx.arc(ex,ey,6,0,6.283);cx.fillStyle='rgba(150,225,185,.18)';cx.fill();
      cx.beginPath();cx.arc(ex,ey,2.4,0,6.283);cx.fillStyle='rgba(220,250,232,.9)';cx.fill();
    }
  }

  /* 星点与宿名 */
  cx.textAlign='center';
  for(var j=0;j<XI.length;j++){
    var p=P(j),born=t-(STAR0+j*STAR_GAP);
    if(born<=0){ /* 未点亮：暗金锚点 */
      cx.beginPath();cx.arc(p[0],p[1],2,0,6.283);cx.fillStyle='rgba(216,180,90,.22)';cx.fill();
      continue;
    }
    var b=outCubic(born/STAR_DUR);
    var tw=1+.06*Math.sin(t*2+j);
    if(born<STAR_DUR){ /* 点亮瞬间：一圈柔光扩散，仅一次，不闪烁 */
      var rb=outCubic(born/STAR_DUR);
      cx.beginPath();cx.arc(p[0],p[1],6+16*rb,0,6.283);
      cx.strokeStyle='rgba(216,180,90,'+(.45*(1-rb)).toFixed(3)+')';cx.lineWidth=1.5;cx.stroke();
    }
    cx.beginPath();cx.arc(p[0],p[1],11*tw,0,6.283);   /* 外环 */
    cx.strokeStyle='rgba(216,180,90,'+(.32*b*(1+.25*pulse)).toFixed(3)+')';cx.lineWidth=1;cx.stroke();
    cx.beginPath();cx.arc(p[0],p[1],5.5*b*tw,0,6.283); /* 金核 */
    cx.fillStyle='#d8b45a';cx.fill();
    cx.beginPath();cx.arc(p[0],p[1],2.4*b,0,6.283);
    cx.fillStyle='rgba(255,244,214,.95)';cx.fill();
    /* 宿名：金色小字淡入并微微上浮 */
    var na=outCubic(born/.7);
    if(na>0){
      cx.font='600 16px "Noto Serif SC","STZhongsong","SimSun",serif';
      cx.shadowColor='rgba(216,180,90,.5)';cx.shadowBlur=9;
      cx.fillStyle='rgba(216,180,90,'+(.95*na).toFixed(3)+')';
      cx.fillText(XI[j][2],p[0],p[1]-16-6*na);
      cx.shadowBlur=0;
    }
  }

  /* 结尾：整体淡出露出提示，同时向 window 派发 "dragon:done" */
  if(!fired&&t>=FADE_T){
    fired=true;
    scene.classList.add('is-out');
    hint.classList.add('is-on');
    replayTip.classList.add('is-on');
    window.dispatchEvent(new CustomEvent('dragon:done',{detail:{at:+t.toFixed(2),replayable:true}}));
  }
}
requestAnimationFrame(draw);

/* 点击任意处重播：重置 CSS 动画与 canvas 时间轴 */
addEventListener('click',function(){
  root.classList.remove('play');
  scene.classList.remove('is-out');
  hint.classList.remove('is-on');
  replayTip.classList.remove('is-on');
  void root.offsetWidth;   /* 强制回流，让标题/细线动画从头再播 */
  root.classList.add('play');
  t0=null;fired=false;
});
})();
</script>
</body>
</html>
